<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 450px;
  padding: 40px;
  border: 1px solid #dadce0;
  border-radius: 8px;
  text-align: center;
}

.logo {
  font-size: 42px;
  font-weight: bold;
  margin-bottom: 25px;
}

.blue {
  color: #4285f4;
}

.red {
  color: #ea4335;
}

.yellow {
  color: #fbbc05;
}

.green {
  color: #34a853;
}

h1 {
  font-size: 24px;
  font-weight: 400;
  color: #202124;
  margin-bottom: 12px;
}

p {
  color: #5f6368;
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 25px;
}

input {
  width: 100%;
  height: 52px;
  border: 1px solid #dadce0;
  border-radius: 4px;
  padding: 0 14px;
  font-size: 16px;
  margin-bottom: 25px;
}

input:focus {
  outline: 2px solid #4285f4;
  border-color: transparent;
}

button {
  width: 100%;
  height: 45px;
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #1765cc;
}

a {
  display: block;
  margin-top: 25px;
  color: #1a73e8;
  text-decoration: none;
  font-size: 14px;
}

a:hover {
  text-decoration: underline;
}

#message {
  display: none;
  margin-top: 20px;
  color: #188038;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <span class="blue">G</span>
    <span class="red">o</span>
    <span class="yellow">o</span>
    <span class="blue">g</span>
    <span class="green">l</span>
    <span class="red">e</span>
  </div>

  <h1>Forgot Password?</h1>

  <p>
    Enter your email address to recover your account.
  </p>

  <form id="forgotForm">
    <input 
      type="email" 
      placeholder="Email or phone"
      required
    >

    <button type="submit">
      Send Reset Link
    </button>
  </form>

  <div id="message">
    Check your email for password recovery instructions.
  </div>

  <a href="https://accounts.google.com/">
    Back to Sign In
  </a>

</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", function(e) {
  e.preventDefault();
  document.getElementById("message").style.display = "block";
});
</script>

</body>
</html>
